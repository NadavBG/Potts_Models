# Fast end-to-end smoke test of the whole DAG (mask -> train -> sample x2 ->
# render -> manifest, plus the independent msa_stats branch).
# Tiny N_iter / N_chains / k_MCMC / N keep it to seconds.
#
#   snakemake --configfile config/params_tiny.yaml --cores 8 all

run_name: tiny
description: Fast smoke test of the full pipeline DAG
family: CM
msa_fasta: data/fasta/CM.fasta
seed: 42
omp_num_threads: null

msa_stats:
  enabled: true
  theta: 0.7
  lbda: 0.03
  Dia_prior: gap-corrected
  sector: emily

pruning:
  enabled: true
  theta: 0.7
  lbda: 0.03
  label: CM
  Dia_prior: gap-corrected
  couplings: { strategy: sca, percent: 98.0 }
  fields:    { strategy: dia, percent: 98.0 }

train:
  mode: BM
  optimizer: LBFGS
  N_iter: 5
  N_chains: 4
  m: 20
  lambda_J: 0.01
  lambda_h: 0.01
  theta: 0.3
  k_MCMC: 200
  TestTrain: 0
  record_every: 1
  ignore_gaps: false

sample:
  N: 50
  temperatures: [0.75, 1.0]

figures:
  which: [coupling_evol, params, correlations, pca]
  sector: emily
