# Two-model combine config generated by scripts/new_combine.py.
# The full run steps (score -> design -> characterize) with every path filled
# in live in the minted run dir's RUNBOOK.txt (regenerated on each `snakemake
# ... all`). Edit fields here freely; unknown keys are rejected on load.

run_name: combine-ECCM-dense-derive-PPIC-profile
models:
- name: ECCM-dense
  run_dir: results/ECCM-dense/iter-002-nchains-200
- name: derive-PPIC-profile
  run_dir: results/derive-PPIC-profile/iter-002-nchains-200
description: Cross-score ECCM-dense and derive-PPIC-profile under both models
seed: 42
omp_num_threads: null
query:
  source: model_sets
  include:
  - natural
  fasta: null
  cap_per_group: 0
  n_random: 500
  random_length: 91
scoring:
  method: potts_align
  n_samples: 1000
  ess_threshold: 100.0
  n_shards: 512
  pa_cross_subsample_origin: derive-PPIC-profile
  pa_cross_subsample_under: ECCM-dense
  pa_cross_subsample_n: 2000
figures:
  enabled: true
design:
  enabled: true
  # iter-002: equal nominal weights (override the naturals-derived 0.11/0.89, which
  # was PPIC-dominated) + 2x steps (iter-001 E_tot had not plateaued at 500k).
  # iter-003: w_a = 0.3 since iter-002 heavily weighted CMs.
  w_a: 0.3
  w_b: 0.7
  start_random: 48
  start_natural_a: 24
  start_natural_b: 24
  steps: 1000000
  seed: 0
  min_length: 70
  beta_start: 1.0
  beta_end: 10.0
  teleport_frac: 0.3
  record_every: 1000
  polish: true
  polish_schedule: fast
  execution: cluster
  local_budget_minutes: 30.0
  n_shards: 64
characterize:
  enabled: true
