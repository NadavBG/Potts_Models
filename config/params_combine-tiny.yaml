# Fast end-to-end smoke test of the combine DAG (resolve_models -> build_query
# -> score -> render -> manifest). Tiny per-group cap + few IS samples keep it
# to seconds. Reuses the existing CM and PPIC dense models.
#
#   snakemake -s Snakefile.combine --configfile config/params_combine-tiny.yaml --cores 8 all

run_name: combine-tiny
description: Fast smoke test of the two-model combine pipeline
seed: 42
omp_num_threads: null

models:                        # E_tot weights derived post-hoc from the naturals
                               # (compute_weights), not set here.
  - name: CM-bm-dense
    run_dir: results/CM-bm-dense/iter-002-base-model
  - name: PPIC-dense
    run_dir: results/PPIC-dense/iter-001-baseline

query:
  source: model_sets
  include: [natural, synthetic]
  cap_per_group: 4             # 4 sequences per group keeps the run tiny

scoring:
  method: marginal             # smoke-test the FFBS / importance-sampling path end-to-end
                               # (the production default is 'map'; see params_combine-CM-PPIC)
  n_samples: 50
  ess_threshold: 100.0

figures:
  enabled: true

design:                          # smoke-test the two-model design stage end-to-end
  enabled: true
  start_random: 2
  start_natural_a: 1             # 1 CM-natural-seeded chain
  start_natural_b: 1             # 1 PPIC-natural-seeded chain
  steps: 2000
  seed: 0
  record_every: 500
  polish: true
  polish_schedule: fast          # warm-started; seconds at this size
  execution: auto                # tiny estimate -> LOCAL
