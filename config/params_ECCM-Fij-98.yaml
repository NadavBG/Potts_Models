# ECCM (E. coli chorismate mutase, self-generated MSA), BM regime — f_ij-
# coupling pruning at 98% (fields unpruned). L=94, so sectors are dropped
# from all figures.
#
#   python scripts/iter.py run ECCM-Fij-98 "fij98"
# or
#   snakemake --configfile config/params_ECCM-Fij-98.yaml --cores 8 all

run_name: ECCM-Fij-98
description: ECCM Fij-pruned at 98% # No colons!
family: ECCM
msa_fasta: data/fasta/eccm_msa.fasta
seed: 42
omp_num_threads: 8          # pin (e.g. 8) for bit-identical re-runs

msa_stats:                     # MSA-only figure; independent of training
  enabled: true
  theta: 0.7
  lbda: 0.03
  Dia_prior: gap-corrected
  sector: none

pruning:
  enabled: true
  theta: 0.7
  lbda: 0.03
  label: ECCM
  Dia_prior: gap-corrected
  couplings: { strategy: fij, percent: 98.0 }
  fields: null

train:                         # BM regime (Summary Note 3)
  mode: BM
  optimizer: LBFGS
  N_iter: 400
  N_chains: 200                # raised from 100 to fix low-Meff BM gradient-noise under-convergence (docs/TRAINING_CONVERGENCE.md)
  m: 20
  lambda_J: 0.01
  lambda_h: 0.01
  theta: 0.3
  k_MCMC: 100000
  TestTrain: 0
  record_every: 5
  ignore_gaps: false

sample:
  N: 2000
  temperatures: [0.75, 1.0]

figures:
  which: null                  # null = every figure whose data is present
  sector: none                 # dropped: ECCM is L=94, the "emily" sector is L=96-specific
  max_seqs_per_group: 2000     # cap for O(N^2) similarity/diversity (0 = no cap);
                               # bounds the ~15k-seq ECCM MSA, seeded by the run seed
