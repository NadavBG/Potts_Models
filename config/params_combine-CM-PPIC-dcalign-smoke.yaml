# Tier-2 real-model SMOKE for the DCAlign couplings-aware combine path. Same two
# (real, synced) models and method as params_combine-CM-PPIC-dcalign.yaml, but a
# tiny query (cap_per_group: 2 -> ~12 seqs over 6 groups, ~24 alignments) and
# n_shards: 2 so the whole sbatch array -> gather -> finalize -> score path runs
# in minutes. Validates the model handoff + agreement canary on the real models
# before the full cap=300 run. Run with DCALIGN_TINY=1 (short walltime; memory is
# NOT shrunk -- the deltan seed dist needs the full 16G default, see run_dcalign_align.sh):
#
#   RR=combine/combine-CM-PPIC-dcalign-smoke/iter-001-tier2-smoke
#   .venv/bin/python scripts/iter.py new combine-CM-PPIC-dcalign-smoke "tier2-smoke" --snakefile Snakefile.combine
#   .venv/bin/python -m snakemake -s Snakefile.combine \
#       --configfile config/params_combine-CM-PPIC-dcalign-smoke.yaml \
#       --config run_root=$RR --cores 4 $RR/query/query.fasta $RR/models.json
#   DCALIGN_TINY=1 bash pipeline/external/run_dcalign_align.sh $RR 2
#   bash pipeline/external/finalize_dcalign_push.sh $RR        # no --push
#   .venv/bin/python -m snakemake -s Snakefile.combine \
#       --configfile config/params_combine-CM-PPIC-dcalign-smoke.yaml \
#       --config run_root=$RR --cores 4 all

run_name: combine-CM-PPIC-dcalign-smoke
description: Tier-2 real-model smoke for DCAlign couplings-aware two-model scoring  # No colons!
seed: 42
omp_num_threads: null

models:                        # exactly two; E_tot = w_A*E_A + w_B*E_B.
  - name: CM-bm-dense
    run_dir: results/CM-bm-dense/iter-002-base-model
    weight: 1.0
  - name: PPIC-dense
    run_dir: results/PPIC-dense/iter-001-baseline
    weight: 1.0

query:
  source: model_sets
  include: [natural, synthetic]
  cap_per_group: 2             # tiny: ~2 seqs/group x 6 groups = ~12 query seqs -> ~24 alignments

scoring:
  method: dcalign              # couplings-aware; reads the on-disk align cache and
                               # recomputes energy in-frame (gauge-consistent with map).
  dcalign_path: null           # DCAlign clone; null -> DCALIGN_PATH env (Midway: <repo>/../DCAlign)
  julia: null                  # julia binary; null -> JULIA_BINARY env / `which julia`
  dcalign_seed: 0              # DCAlign RNG seed (palign seed=)
  maxiter: 2000                # BP sweeps per sequence (palign maxiter=; auto-bumped to 5000 when N<L)
  pcount: 0.001                # insertion-prior pseudocount floor (palign pcount=)
  lambda_spec: deltan          # informed prior (DCAlign.deltan_prior from the model's own MSA, §10.13)
  n_shards: 2                  # Slurm array = 2*n_shards = 4 tasks (one per model x shard)
  # n_samples / ess_threshold are unused by dcalign (kept at defaults for schema completeness)
  n_samples: 1000
  ess_threshold: 100.0

figures:
  enabled: true
