# PPIC (E. coli parvulin Par10 / ppiC), BM regime — dense model (no
# pruning, no stochastic regularization).
#
#   python scripts/iter.py run PPIC-dense "baseline"
# or
#   snakemake --configfile config/params_PPIC-dense.yaml --cores 8 all

run_name: PPIC-profile
description: Profile PPIC model (no couplings). # No colons!
family: PPIC
msa_fasta: data/fasta/ppic_msa.fasta
seed: 42
omp_num_threads: 8          # pin (e.g. 8) for bit-identical re-runs

msa_stats:                     # MSA-only figure; independent of training
  enabled: true
  theta: 0.7
  lbda: 0.03
  Dia_prior: gap-corrected
  sector: none

pruning:
  enabled: true
  theta: 0.7
  lbda: 0.03
  label: PPIC
  Dia_prior: gap-corrected
  couplings: { strategy: fij, percent: 100 }
  fields: null

train:                         # BM regime (Summary Note 3)
  mode: BM
  optimizer: LBFGS
  N_iter: 400
  N_chains: 200                # raised from 100 for parity with ECCM (docs/TRAINING_CONVERGENCE.md); PPIC converged at 100 but kept equal
  m: 20
  lambda_J: 0.01
  lambda_h: 0.01
  theta: 0.3
  k_MCMC: 100000
  TestTrain: 0
  record_every: 5
  ignore_gaps: false

sample:
  N: 2000
  temperatures: [0.75, 1.0]

figures:
  which: null                  # null = every figure whose data is present
  sector: none                 # "emily" sector is CM-specific (L=96); n/a for PPIC
  max_seqs_per_group: 2000     # cap for O(N^2) similarity/diversity (0 = no cap);
                               # bounds the ~26k-seq PPIC MSA, seeded by the run seed
