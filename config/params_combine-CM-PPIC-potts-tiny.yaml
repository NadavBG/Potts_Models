# Fast CLUSTER smoke test of the potts_align combine pipeline (iter-003). Unlike
# a pure-local smoke test, this exercises the FULL sbatch path — the same
# run_potts_align_align.sh -> Slurm array (+ afterok gather) -> finalize machinery
# the real run uses — but sized to finish in UNDER 2 MINUTES and WELL UNDER 1 SU.
# It follows the SAME Mac/Midway split as the real run (config/params_combine-
# CM-PPIC-potts.yaml): snakemake runs ONLY on the Mac; the Midway login node runs
# only the bash drivers (no snakemake, no heavy compute). Code moves by git; the
# gitignored combine/ + results/ data moves by rsync (scripts/sync_models.sh).
#
#   RR=combine/combine-CM-PPIC-potts-tiny/iter-001-smoke   # shared-FS path, NOT /tmp:
#                                                          # array tasks run on compute nodes
#   # 1. MAC — build the pre-align inputs (config_snapshot, models.json, query;
#   #    no random controls). snapshot_config is its own rule, so name it.
#   snakemake -s Snakefile.combine --configfile config/params_combine-CM-PPIC-potts-tiny.yaml \
#       --config run_root=$RR --cores 8 \
#       $RR/config_snapshot.yaml $RR/models.json $RR/query/query.fasta
#   # 2. MAC — commit + push code (the driver refuses a dirty tree and pulls origin),
#   #    then rsync the models + pre-align dir up:
#   git add -A && git commit -m "combine potts_align tiny smoke" && git push
#   scripts/sync_models.sh push
#   # 3. MIDWAY login — plan (n_shards=3) + 3-task array + afterok gather (NO snakemake):
#   bash pipeline/external/run_potts_align_align.sh $RR
#   # 4. MIDWAY login — when the gather job mails END, validate + reclaim space:
#   bash pipeline/external/finalize_potts_align.sh $RR
#   # 5. MAC — pull the cache back, then score + render (snakemake HERE):
#   scripts/sync_models.sh pull
#   snakemake -s Snakefile.combine --configfile config/params_combine-CM-PPIC-potts-tiny.yaml \
#       --config run_root=$RR --cores 8 all
#
# COST DIAL: a g=5 PT pair costs ~74 s on a caslake core; every other pair here
# is an instant g<=3 enumerate. cap_per_group=2 + cross-subsample=1 leaves exactly
# ONE PT pair (one PPIC natural scored under CM); the other PPIC natural under CM
# is skip_subsample, CM naturals under PPIC are skip_NgtL, and all homes enumerate.
# So the whole run is: 4 homes (enumerate, ~instant) + 1 cross PT pair (~1.2 min).
# n_shards=3 round-robins the 5 in-scope pairs into 3 array tasks (sizes 2,2,1),
# all placed concurrently, so the task holding the PT pair sets the wall clock at
# ~1.5 min < 2 min; the array's total core-time is ~0.05 core-h and the gather is
# seconds, so the run stays well under 1 SU. (More shards than in-scope pairs is
# fine — extra shards just get empty slices and exit "nothing to do".)
#
# The random negative-control group is OMITTED here (n_random=0) because each
# valid control (N<=91) is itself a ~1 min PT pair under CM; it is exercised only
# in the real run (build_query + the random_length<=min(L) guard run cheaply in
# the Mac-side build-inputs step).
#
# To debug the shard/gather logic WITHOUT the cluster, the entrypoints are pure
# numpy and still run locally: `run_potts_align_shard.py plan --n-shards 3` then
# `run ... --shard 0..2` then `run_potts_align_gather.py`. The cluster path above
# is the point of this config; the local path is a fallback.
#
# The real run uses config/params_combine-CM-PPIC-potts.yaml (full naturals +
# 500 controls, ~94 SU on a 512-task Slurm array via run_potts_align_align.sh).

run_name: combine-CM-PPIC-potts-tiny
description: Cluster smoke test of the potts_align combine pipeline (tiny query set, 3-task array)
seed: 42
omp_num_threads: null

models:                        # exactly two; E_tot weights derived post-hoc from
                               # the naturals (compute_weights), not set here.
  - name: CM-bm-dense          # L=96
    run_dir: results/CM-bm-dense/iter-002-base-model
  - name: PPIC-dense           # L=91
    run_dir: results/PPIC-dense/iter-001-baseline

query:
  source: model_sets
  include: [natural]
  cap_per_group: 2             # tiny: 2 naturals per model
  n_random: 0                  # controls omitted (each is a ~1 min PT pair); see header
  random_length: 0

scoring:
  method: potts_align
  n_shards: 3                  # 3-task Slurm array over the 5 in-scope pairs (~1.5 min wall, <1 SU)
  pa_cross_subsample_origin: PPIC-dense
  pa_cross_subsample_under: CM-bm-dense
  pa_cross_subsample_n: 1      # exactly ONE PPIC->CM PT pair; the other -> skip_subsample
  n_samples: 1000              # unused by potts_align
  ess_threshold: 100.0         # unused

figures:
  enabled: true
