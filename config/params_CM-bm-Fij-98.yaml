# CM, BM positive control — f_ij-coupling pruning at 98% (fields unpruned).
#
#   python scripts/iter.py run CM-bm-Fij-98 "fij98"
# or
#   snakemake --configfile config/params_CM-bm-Fij-98.yaml --cores 8 all

run_name: CM-bm-Fij-98
description: CM Fij-pruned at 98%
family: CM
msa_fasta: data/fasta/CM.fasta
seed: 42
omp_num_threads: 8          # pin (e.g. 8) for bit-identical re-runs

msa_stats:                     # MSA-only figure; independent of training
  enabled: true
  theta: 0.7
  lbda: 0.03
  Dia_prior: gap-corrected
  sector: emily

pruning:
  enabled: true
  theta: 0.7
  lbda: 0.03
  label: CM
  Dia_prior: gap-corrected
  couplings: { strategy: fij, percent: 98.0 }
  fields: null

train:                         # BM regime (Summary Note 3)
  mode: BM
  optimizer: LBFGS
  N_iter: 400
  N_chains: 100
  m: 20
  lambda_J: 0.01
  lambda_h: 0.01
  theta: 0.3
  k_MCMC: 100000
  TestTrain: 0
  record_every: 5
  ignore_gaps: false

sample:
  N: 2000
  temperatures: [0.75, 1.0]

figures:
  which: null                  # null = every figure whose data is present
  sector: emily
