# Two-model combine run scored with DCAlign (couplings-aware alignment, spec
# §10.9) instead of fields-Viterbi `map`. The expensive Julia alignment runs
# out-of-process on the cluster (pipeline/external/run_dcalign_align.sh) and is
# cached; the `score` step reads the cache and recomputes energies in-frame.
#
#   # 1. build the query (cheap); name config_snapshot.yaml too — the cluster
#   #    driver's preflight requires it and snapshot_config is an independent rule:
#   RR=combine/combine-CM-PPIC-dcalign/iter-001-baseline
#   snakemake -s Snakefile.combine --configfile config/params_combine-CM-PPIC-dcalign.yaml \
#       --config run_root=$RR --cores 4 $RR/config_snapshot.yaml $RR/models.json $RR/query/query.fasta
#   # 2. align on the cluster (FAN-OUT: 1 core/task, many shards — DCAlign threads
#   #    only ~3x on 8 cores, so 1-core tasks are cheaper + ~100% efficient):
#   DCALIGN_CPUS=1 DCALIGN_MAX_CONCURRENT=512 bash pipeline/external/run_dcalign_align.sh $RR
#   # 3. score (see pipeline/external/README.md). Full run ~160-230 core-hours.

run_name: combine-CM-PPIC-dcalign
description: Cross-score CM and PPIC under both models with couplings-aware DCAlign  # No colons!
seed: 42
omp_num_threads: null

models:                        # exactly two; E_tot = w_A*E_A + w_B*E_B.
  - name: CM-bm-dense
    run_dir: results/CM-bm-dense/iter-002-base-model
    weight: 1.0
  - name: PPIC-dense
    run_dir: results/PPIC-dense/iter-001-baseline
    weight: 1.0

query:
  source: model_sets
  include: [natural, synthetic]
  cap_per_group: 300           # seeded subsample per group; bounds the align cost.
                               # 6 groups -> 1800 seqs -> 3600 alignments. 0 = no cap;
                               # drop logged. Mean ~200 s/seq (these queries are ~all
                               # N<L, the slow 5000-sweep regime), not the 19 s spike median.

scoring:
  method: dcalign              # couplings-aware; reads the on-disk align cache and
                               # recomputes energy in-frame (gauge-consistent with map).
  dcalign_path: null           # DCAlign clone; null → DCALIGN_PATH env (Midway: <repo>/../DCAlign)
  julia: null                  # julia binary; null → JULIA_BINARY env / `which julia`
  dcalign_seed: 0              # DCAlign RNG seed (palign seed=)
  maxiter: 2000                # BP sweeps per sequence (palign maxiter=; auto-bumped to 5000 when N<L)
  pcount: 0.001                # insertion-prior pseudocount floor (palign pcount=)
  lambda_spec: flat            # phase-1 insertion prior (mass on Δn=1); phase-2: informed deltan_prior
  n_shards: 256                # Slurm array = 2*n_shards tasks (one per model x shard).
                               # 256 -> 512 one-core tasks (~7 seqs each) for the fan-out
                               # launch above; well under the 1000-job / 4800-core QOS cap.
  # n_samples / ess_threshold are unused by dcalign (kept at defaults for schema completeness)
  n_samples: 1000
  ess_threshold: 100.0

figures:
  enabled: true
